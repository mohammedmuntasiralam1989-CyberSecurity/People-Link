services:
  # The Node.js Web Server
  - type: web
    name: people-link-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: people-link-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # You will set this manually in Render Dashboard

databases:
  # The PostgreSQL Database
  - name: people-link-db
    plan: free
    region: oregon # Choose the region closest to you
    databaseName: people_link
    user: postgres