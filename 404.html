<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Link - Page Not Found</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Ionicons & FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", "Inter", system-ui, sans-serif; }
        body { background: #0a0a0a; color: #eef2ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px; }
        .code { font-size: 8rem; font-weight: 900; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .title { font-size: 1.5rem; margin: 16px 0 12px; font-weight: 600; }
        .desc { color: #9ca3af; font-size: 0.95rem; margin-bottom: 28px; }
        .back-btn { display: inline-block; padding: 12px 32px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; text-decoration: none; border-radius: 24px; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="title">Page Not Found</div>
        <div class="desc">The page you're looking for doesn't exist or has been moved.</div>
        <a href="feed.html" class="back-btn">← Go Home</a>
    </div>
</body>
</html>
