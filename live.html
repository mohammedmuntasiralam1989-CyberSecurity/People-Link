<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Link - Live</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Ionicons & FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .live-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .live-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
        .live-badge { background: #ff4757; color: #fff; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 14px; width: fit-content; }
        .live-controls { pointer-events: auto; display: flex; gap: 10px; margin-top: auto; }
        .control-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(10px); }
        .control-btn.end { background: #ff4757; }
        .chat-sidebar { width: 300px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
        .chat-input { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 8px; }
        .chat-input input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 12px; border-radius: 20px; outline: none; }
        .status-msg { position: absolute; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div style="display: flex; flex: 1;">
        <div class="live-container">
            <video id="liveVideo" autoplay playsinline></video>
            <div id="statusOverlay" class="status-msg">Connecting to live stream...</div>
            <div class="live-overlay">
                <div class="live-badge">LIVE</div>
                <div class="live-controls" id="liveControls" style="display: none;">
                    <button class="control-btn end" id="endLiveBtn">End Live</button>
                    <button class="control-btn" id="toggleCamBtn">🎥 Toggle Camera</button>
                    <button class="control-btn" id="toggleMicBtn">🎤 Toggle Mic</button>
                </div>
            </div>
        </div>
        <div class="chat-sidebar">
            <div style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: bold;">Live Chat</div>
            <div class="chat-messages" id="chatMsgs"></div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Say something...">
                <button class="control-btn" style="padding: 8px 15px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('liveVideo');
        const statusOverlay = document.getElementById('statusOverlay');
        const liveControls = document.getElementById('liveControls');
        const chatMsgs = document.getElementById('chatMsgs');
        const msgInput = document.getElementById('msgInput');
        
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode'); // 'host' or 'watch'
        const liveId = params.get('id');
        
        let myPeer = null;
        let localStream = null;

        async function init() {
            const currentUser = JSON.parse(localStorage.getItem('peoplelink_currentUser') || '{}');
            if (!currentUser.id) { window.location.href = 'login.html'; return; }

            myPeer = new Peer(mode === 'host' ? liveId : undefined, {
                host: window.location.hostname,
                port: window.location.port || (window.location.protocol === 'https:' ? 443 : 80),
                path: '/peerjs',
                secure: window.location.protocol === 'https:'
            });

            if (mode === 'host') {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    video.srcObject = localStream;
                    video.muted = true;
                    statusOverlay.style.display = 'none';
                    liveControls.style.display = 'flex';
                    
                    myPeer.on('call', call => {
                        call.answer(localStream);
                    });
                    
                    // Send heartbeat every 30 seconds
                    setInterval(async () => {
                        const token = localStorage.getItem('peoplelink_authToken');
                        await fetch('/api/live/heartbeat', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ liveId })
                        });
                    }, 30000);
                    
                    // Initial heartbeat
                    const token = localStorage.getItem('peoplelink_authToken');
                    fetch('/api/live/heartbeat', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ liveId })
                    });

                } catch (e) {
                    statusOverlay.textContent = 'Camera/Mic access denied';
                }
            } else {
                const call = myPeer.call(liveId, new MediaStream()); // Empty stream to start
                call.on('stream', remoteStream => {
                    video.srcObject = remoteStream;
                    statusOverlay.style.display = 'none';
                });
                call.on('error', () => { statusOverlay.textContent = 'Stream ended or unavailable'; });
            }
        }

        document.getElementById('endLiveBtn')?.addEventListener('click', () => {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            window.location.href = 'feed.html';
        });

        document.getElementById('toggleCamBtn')?.addEventListener('click', () => {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                document.getElementById('toggleCamBtn').textContent = videoTrack.enabled ? '🎥 Toggle Camera' : '🚫 Camera Off';
            }
        });

        document.getElementById('toggleMicBtn')?.addEventListener('click', () => {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('toggleMicBtn').textContent = audioTrack.enabled ? '🎤 Toggle Mic' : '🔇 Mic Off';
            }
        });

        // Live chat send
        const chatSendBtn = document.querySelector('.chat-input .control-btn');
        if (chatSendBtn) {
            function sendChatMsg() {
                const text = msgInput.value.trim();
                if (!text) return;
                const currentUser = JSON.parse(localStorage.getItem('peoplelink_currentUser') || '{}');
                const name = currentUser.fullName || currentUser.username || 'You';
                chatMsgs.innerHTML += `<div style="margin-bottom:8px;"><strong style="color:#a855f7;">${name}:</strong> ${text}</div>`;
                chatMsgs.scrollTop = chatMsgs.scrollHeight;
                msgInput.value = '';
            }
            chatSendBtn.addEventListener('click', sendChatMsg);
            msgInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendChatMsg(); });
        }

        init();
    </script>
</body>
</html>
