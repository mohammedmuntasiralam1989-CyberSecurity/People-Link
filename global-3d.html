<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Link - Global 3D Universe</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Ionicons & FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #universe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .universe-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, #666);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }

        .universe-stats {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .user-card-3d {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 300px;
            padding: 24px;
            z-index: 100;
            display: none;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .user-card-3d.active {
            display: block;
        }

        .user-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fff, #444);
            margin: 0 auto 15px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .user-name-large {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .user-handle-large {
            text-align: center;
            color: var(--primary);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .online-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 10px #00ff88;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            padding: 10px 20px;
            pointer-events: auto;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loader"></div>
        <p>Initializing Neural Network...</p>
    </div>

    <a href="feed.html" class="btn btn-secondary back-btn">Exit Universe</a>

    <div class="ui-overlay">
        <h1 class="universe-title">People Universe</h1>
        <div class="universe-stats" id="universe-stats">
            NODES: 0 | ACTIVE_NEURONS: 0
        </div>
    </div>

    <div id="universe-container"></div>

    <div class="glass-card user-card-3d" id="user-profile-card">
        <div class="user-avatar-large" id="card-avatar"></div>
        <h2 class="user-name-large" id="card-name">Username</h2>
        <div class="user-handle-large" id="card-handle">@handle</div>
        <p style="font-size: 13px; color: #aaa; text-align: center; margin-bottom: 20px;" id="card-bio">
            Visualizing digital presence in real-time.
        </p>
        <button class="btn btn-primary" style="width: 100%;" id="view-profile-btn">View Full Profile</button>
    </div>

    <script>
        // Global variables
        let scene, camera, renderer, controls, raycaster, mouse;
        let userNodes = [];
        let connectionLines;
        let INTERSECTED;

        async function init() {
            // Setup Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.0008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 1000;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('universe-container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            camera.add(pointLight);
            scene.add(camera);

            // Fetch Users
            try {
                const response = await fetch('db.json');
                const data = await response.json();
                createUniverse(data.users);
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-screen').remove(), 500);
            } catch (error) {
                console.error("Failed to load universe data:", error);
            }

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createUniverse(users) {
            const userCount = users.length;
            const radius = 800;

            // Update UI Stats
            document.getElementById('universe-stats').innerText = `NODES: ${userCount} | ACTIVE_NEURONS: ${Math.floor(userCount * 0.4)}`;

            // Create Starfield Background
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 5000;
            const positions = new Float32Array(starsCount * 3);
            for (let i = 0; i < starsCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 10000;
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.5 });
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);

            // Create User Nodes
            users.forEach((user, i) => {
                // Random position in a sphere
                const phi = Math.acos(-1 + (2 * i) / userCount);
                const theta = Math.sqrt(userCount * Math.PI) * phi;

                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(phi);

                // Online simulation (every 3rd user is "online")
                const isOnline = i % 3 === 0;
                
                const geometry = new THREE.SphereGeometry(isOnline ? 15 : 8, 32, 32);
                const material = new THREE.MeshPhongMaterial({
                    color: isOnline ? 0x00ff88 : 0x4444ff,
                    emissive: isOnline ? 0x00ff88 : 0x000000,
                    emissiveIntensity: isOnline ? 0.5 : 0,
                    shininess: 100,
                    transparent: true,
                    opacity: 0.9
                });

                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, z);
                sphere.userData = { ...user, isOnline };
                
                scene.add(sphere);
                userNodes.push(sphere);
            });

            // Create Connections between "online" nodes
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.1 });
            const lineGeometry = new THREE.BufferGeometry();
            const linePositions = [];

            userNodes.filter(n => n.userData.isOnline).forEach((node, i, arr) => {
                if (i < arr.length - 1) {
                    linePositions.push(node.position.x, node.position.y, node.position.z);
                    linePositions.push(arr[i+1].position.x, arr[i+1].position.y, arr[i+1].position.z);
                }
            });

            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            connectionLines = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(connectionLines);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(userNodes);

            if (intersects.length > 0) {
                const user = intersects[0].object.userData;
                showUserProfile(user);
            } else {
                document.getElementById('user-profile-card').classList.remove('active');
            }
        }

        function showUserProfile(user) {
            const card = document.getElementById('user-profile-card');
            document.getElementById('card-name').innerText = user.fullName;
            document.getElementById('card-handle').innerHTML = `${user.isOnline ? '<span class="online-indicator"></span>' : ''}@${user.username}`;
            document.getElementById('card-bio').innerText = user.bio || "Connecting through the People Link universe.";
            
            // Set avatar if exists
            const avatar = document.getElementById('card-avatar');
            if (user.avatarUrl) {
                avatar.style.backgroundImage = `url(${user.avatarUrl})`;
                avatar.style.backgroundSize = 'cover';
            } else {
                avatar.style.background = `linear-gradient(135deg, #6366f1, #a855f7)`;
                avatar.innerHTML = `<span style="display:flex; align-items:center; justify-content:center; height:100%; font-weight:800; font-size:24px;">${user.username[0].toUpperCase()}</span>`;
            }

            card.classList.add('active');
            
            document.getElementById('view-profile-btn').onclick = () => {
                window.location.href = `profile.html?id=${user.id}`;
            };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Hover effect
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(userNodes);

            if (intersects.length > 0) {
                if (INTERSECTED != intersects[0].object) {
                    if (INTERSECTED) INTERSECTED.scale.set(1, 1, 1);
                    INTERSECTED = intersects[0].object;
                    INTERSECTED.scale.set(1.5, 1.5, 1.5);
                }
            } else {
                if (INTERSECTED) INTERSECTED.scale.set(1, 1, 1);
                INTERSECTED = null;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
